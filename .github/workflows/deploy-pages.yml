name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'prototype/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: prototype/package-lock.json

      - name: Install
        working-directory: prototype
        run: npm ci

      - name: Build static SPA
        working-directory: prototype
        env:
          # Project Pages URL: https://phenombs.github.io/executive-recruiting/
          VITE_BASE_PATH: /executive-recruiting/
        run: npm run build:web

      # GitHub Pages serves 404.html for unknown paths; copy index so deep links work.
      - name: SPA fallback for deep links
        run: cp prototype/dist/index.html prototype/dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: prototype/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
